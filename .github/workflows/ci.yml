
name: GitHub Actions - SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Instalar dependências
      - name: Install dependencies
        run: npm ci

      # 4. Executar análise de código (Lint)
      - name: Lint
        run: npm run lint

      # 5. Executar testes unitários
      - name: Unit tests
        run: npm test

      # 6. Gerar relatório de cobertura
      - name: Test coverage
        run: npm run coverage

      # 7. Compilar o projeto
      - name: Build
        run: npm run build

      # 8. Cache do SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 9. Análise de qualidade no SonarQube Cloud
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=tcallegaro
            -Dsonar.projectKey=TCallegaro_IC-SPA
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,.github/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
